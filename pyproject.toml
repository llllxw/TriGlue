[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triglue"
version = "0.1.0"
description = "Command-line candidate scoring and ranking workflows for TriGlue"
requires-python = ">=3.8,<3.11"
dependencies = ["numpy>=1.24,<2", "pandas>=1.5,<3"]

[project.optional-dependencies]
chem = ["rdkit>=2023.9", "biopython>=1.81,<1.84"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
triglue = "cli:main"
triglue-prepare = "data_process:main"
triglue-predict = "predict:main"
triglue-train = "train:main"
triglue-explain = "explain:main"

[tool.setuptools]
py-modules = [
  "data_process", "Dataset", "predict", "inference", "model", "gragh_model",
  "sequence_model", "multimodal_fusion", "schema", "feature_cache",
  "structure_resolver", "structure_prediction", "fold_worker", "screen",
  "uncertainty", "cli", "train", "explain", "calibration",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
